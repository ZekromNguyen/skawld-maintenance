name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Download dependencies
        run: go mod download
      - name: Start PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Migrate from empty
        env:
          MIGRATION_DATABASE_URL: postgres://skawld_owner:skawld_owner_dev@localhost:5432/skawld?sslmode=disable
        run: go run ./cmd/migrate up
      - name: Vet
        run: go vet ./...
      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://skawld_app:skawld_app_dev@localhost:5432/skawld?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Build
        run: go build ./cmd/api ./cmd/worker ./cmd/migrate
      - name: Stop dependencies
        if: always()
        run: docker compose down --volumes

  containers:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f deployments/containers/api.Dockerfile -t skawld-maintenance-api:ci .
      - name: Build worker image
        run: docker build -f deployments/containers/worker.Dockerfile -t skawld-maintenance-worker:ci .

  native-packages:
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.7"
          cache: true
      - name: Build Windows, macOS, and Linux packages
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="ci-${GITHUB_RUN_NUMBER}"
          fi
          echo "PACKAGE_VERSION=${version}" >> "$GITHUB_ENV"
          go run ./tools/package \
            -version "${version}" \
            -commit "${GITHUB_SHA}" \
            -built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - uses: actions/upload-artifact@v4
        with:
          name: skawld-maintenance-${{ env.PACKAGE_VERSION }}
          path: dist/packages/${{ env.PACKAGE_VERSION }}/
          if-no-files-found: error
          retention-days: 14
