      description: >
        Workflow review permission and a current scoped ApprovalAuthority are
        both required. Approval records applicability, prerequisites,
        competencies, effective date, and review date.
      tags: [Workflows]
      operationId: reviewWorkflowCandidate
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/WorkflowID"}
        - {$ref: "#/components/parameters/WorkflowVersion"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason, applicability]
              properties:
                decision:
                  type: string
                  enum: [APPROVED, REJECTED, REVIEW_REQUIRED]
                reason: {type: string, minLength: 1, maxLength: 2000}
                applicability:
                  type: array
                  items: {$ref: "#/components/schemas/WorkflowApplicability"}
                prerequisites:
                  type: array
                  maxItems: 20
                  items: {type: string, minLength: 1, maxLength: 200}
                required_competencies:
                  type: array
                  maxItems: 20
                  items: {type: string, minLength: 1, maxLength: 200}
                effective_at: {type: string, format: date-time}
                review_at: {type: string, format: date-time}
      responses:
        "201":
          description: Append-only candidate review recorded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkflowVersion"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/workflows/{workflowID}/versions/{version}/publish:
    post:
      summary: Evaluate and publish an approved workflow candidate
      description: >
        Publication requires workflow-publish permission, a separate current
        ApprovalAuthority, an approved exact digest, unchanged tool contracts,
        and passing deterministic task-success and unsafe-action gates.
      tags: [Workflows]
      operationId: publishWorkflowVersion
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/WorkflowID"}
        - {$ref: "#/components/parameters/WorkflowVersion"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        "200":
          description: Immutable effective-dated workflow version published.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkflowVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/workflows/{workflowID}/versions/{version}/applicability:
    post:
      summary: Approve a separate applicability expansion
      tags: [Workflows]
      operationId: expandWorkflowApplicability
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/WorkflowID"}
        - {$ref: "#/components/parameters/WorkflowVersion"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, applicability]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000}
                applicability:
                  $ref: "#/components/schemas/WorkflowApplicability"
      responses:
        "201":
          description: Separately authorized applicability scope appended.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkflowVersion"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/workflows/{workflowID}/versions/{version}/retire:
    post:
      summary: Retire a published workflow version
      tags: [Workflows]
      operationId: retireWorkflowVersion
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/WorkflowID"}
        - {$ref: "#/components/parameters/WorkflowVersion"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000}
      responses:
        "200":
          description: Workflow version retired and excluded from applicability.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkflowVersion"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/evaluations/summary:
    get:
      summary: Get tenant- and site-scoped pilot quality metrics
      tags: [Evaluation]
      operationId: getEvaluationSummary
      security: [{sessionCookie: []}, {bearerAuth: []}]
      responses:
        "200":
          description: Aggregated latest human labels and workflow evaluation gates.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EvaluationSummary"}
        "403": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: skawld_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token for native/mobile Authorization Code + PKCE.
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    AssetID:
      in: path
      name: assetID
      required: true
      schema: {type: string, format: uuid}
    IncidentID:
      in: path
      name: incidentID
      required: true
      schema: {type: string, format: uuid}
    ExecutionID:
      in: path
      name: executionID
      required: true
      schema: {type: string, format: uuid}
    DemonstrationID:
      in: path
      name: demonstrationID
      required: true
      schema: {type: string, format: uuid}
    WorkflowID:
      in: path
      name: workflowID
      required: true
      schema: {type: string, format: uuid}
    WorkflowVersion:
      in: path
      name: version
      required: true
      schema: {type: integer, minimum: 1}
  requestBodies:
    ExpectedVersion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version]
            properties:
              expected_version: {type: integer, format: int64, minimum: 1}
  responses:
    Problem:
      description: RFC 9457-style problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotentReplay:
      description: Original successful response replayed for the same command.
      headers:
        Idempotent-Replayed:
          schema: {type: string, const: "true"}
  schemas:
    ReportContent:
      type: object
      additionalProperties: false
      required: [summary, measurements, observations, actions, outcome, evidence_ids, unknowns, requires_human_review]
      properties:
        summary: {type: string, minLength: 1, maxLength: 5000}
        measurements: {type: array, maxItems: 100, items: {type: string}}
        observations: {type: array, maxItems: 100, items: {type: string}}
        actions: {type: array, maxItems: 100, items: {type: string}}
        outcome: {type: string}
        evidence_ids: {type: array, items: {type: string}}
        unknowns: {type: array, maxItems: 50, items: {type: string}}
        requires_human_review: {type: boolean, const: true}
    HandoverContent:
      type: object
      additionalProperties: false
      required: [summary, open_incidents, active_executions, safety_concerns, follow_up, evidence_ids, unknowns, requires_human_review]
      properties:
        summary: {type: string, minLength: 1, maxLength: 5000}
        open_incidents: {type: array, maxItems: 100, items: {type: string}}
        active_executions: {type: array, maxItems: 100, items: {type: string}}
        safety_concerns: {type: array, maxItems: 100, items: {type: string}}
        follow_up: {type: array, maxItems: 100, items: {type: string}}
        evidence_ids: {type: array, items: {type: string}}
        unknowns: {type: array, maxItems: 100, items: {type: string}}
        requires_human_review: {type: boolean, const: true}
    Build:
      type: object
      required: [version, commit, built_at]
      properties:
        version:
          type: string
        commit:
          type: string
        built_at:
          type: string
    Liveness:
      type: object
      required: [status, build]
      properties:
        status:
          type: string
          const: live
        build:
          $ref: "#/components/schemas/Build"
    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ready
    Principal:
      type: object
      required: [id, external_subject, display_name, site_ids, permissions]
      properties:
        id:
          type: string
          format: uuid
        external_subject:
          type: string
        display_name:
          type: string
        organization_id:
          type: string
          format: uuid
        site_ids:
          type: array
          items:
            type: string
            format: uuid
        permissions:
          type: array
          items:
            type: string
    Organization:
      type: object
      required: [id, name, source_of_truth, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source_of_truth:
          type: string
          enum: [OWNED_BY_SKAWLD, EXTERNAL_REFERENCE]
        version:
          type: integer
          format: int64
          minimum: 1
    Site:
      type: object
      required: [id, organization_id, code, name, timezone, status]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        timezone:
          type: string
        status:
          type: string
    CreateAsset:
      type: object
      additionalProperties: false
      required: [site_id, tag, name, class, source_of_truth]
      properties:
        site_id: {type: string, format: uuid}
        parent_asset_id: {type: string, format: uuid}
        tag: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        class: {type: string, minLength: 1}
        manufacturer: {type: string}
        model: {type: string}
        source_of_truth:
          type: string
          enum: [OWNED_BY_SKAWLD, EXTERNAL_REFERENCE]
        external_reference:
          type: object
          required: [system, id]
          properties:
            system: {type: string}
            id: {type: string}
            version: {type: string}
        components:
          type: array
          items:
            type: object
            required: [code, name, type]
            properties:
              code: {type: string}
              name: {type: string}
              type: {type: string}
    Asset:
      type: object
      required: [id, organization_id, site_id, tag, name, class, status, source_of_truth, version, components]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        parent_asset_id: {type: string, format: uuid}
        tag: {type: string}
        name: {type: string}
        class: {type: string}
        manufacturer: {type: string}
        model: {type: string}
        status: {type: string, enum: [ACTIVE, INACTIVE, RETIRED]}
        source_of_truth:
          type: string
          enum: [OWNED_BY_SKAWLD, EXTERNAL_REFERENCE]
        version: {type: integer, format: int64}
        components: {type: array, items: {type: object}}
        criticality: {$ref: "#/components/schemas/Criticality"}
    Criticality:
      type: object
      properties:
        rating: {type: string, enum: [A, B, C]}
        safety_impact: {type: integer, minimum: 0, maximum: 5}
        production_impact: {type: integer, minimum: 0, maximum: 5}
        environmental_impact: {type: integer, minimum: 0, maximum: 5}
        financial_impact: {type: integer, minimum: 0, maximum: 5}
        redundancy: {type: string}
        rationale: {type: string}
        approved_by: {type: string, format: uuid}
        approved_at: {type: string, format: date-time}
    CriticalityCommand:
      type: object
      additionalProperties: false
      required: [rating, safety_impact, production_impact, environmental_impact, financial_impact, redundancy, rationale]
      properties:
        rating: {type: string, enum: [A, B, C]}
        safety_impact: {type: integer, minimum: 0, maximum: 5}
        production_impact: {type: integer, minimum: 0, maximum: 5}
        environmental_impact: {type: integer, minimum: 0, maximum: 5}
        financial_impact: {type: integer, minimum: 0, maximum: 5}
        redundancy: {type: string}
        rationale: {type: string, minLength: 1}
    CreateIncident:
      type: object
      additionalProperties: false
      required: [site_id, asset_id, summary, severity, source_of_truth, detected_at]
      properties:
        site_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        summary: {type: string, minLength: 1}
        severity: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
        source_of_truth:
          type: string
          enum: [OWNED_BY_SKAWLD, EXTERNAL_REFERENCE]
        external_system: {type: string}
        external_id: {type: string}
        external_version: {type: string}
        occurred_at: {type: string, format: date-time}
        detected_at: {type: string, format: date-time}
    Incident:
      type: object
      required: [id, organization_id, site_id, asset_id, number, summary, severity, state, source_of_truth, detected_at, version]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        asset_tag: {type: string}
        number: {type: string}
        summary: {type: string}
        severity: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
        state: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED]}
        source_of_truth:
          type: string
          enum: [OWNED_BY_SKAWLD, EXTERNAL_REFERENCE]
        detected_at: {type: string, format: date-time}
        version: {type: integer, format: int64}
    Execution:
      type: object
      required: [id, organization_id, site_id, asset_id, purpose, state, version, steps, prerequisites, measurements, observations, actions, decisions]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        incident_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        asset_tag: {type: string}
        purpose: {type: string}
        state: {type: string, enum: [ASSIGNED, IN_PROGRESS, COMPLETED]}
        version: {type: integer, format: int64}
        steps:
          type: array
          items: {$ref: "#/components/schemas/ExecutionStep"}
        prerequisites: {type: array, items: {type: object}}
        measurements:
          type: array
          items: {$ref: "#/components/schemas/Measurement"}
        observations: {type: array, items: {type: object}}
        actions: {type: array, items: {type: object}}
        decisions: {type: array, items: {type: object}}
    ExecutionStep:
      type: object
      required: [id, key, sequence, title, state, risk_level, version]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        sequence: {type: integer}
        title: {type: string}
        state: {type: string, enum: [PENDING, COMPLETED, BLOCKED]}
        risk_level:
          type: string
          enum: [INFORMATIONAL, ADVISORY, OPERATIONAL_LOW, SAFETY_SIGNIFICANT]
        required_prerequisite: {type: string}
        blocked_reason: {type: string}
        version: {type: integer, format: int64}
    PrerequisiteVerificationCommand:
      type: object
      additionalProperties: false
      required: [type, status, external_reference, verified_at]
      properties:
        type:
          type: string
          enum: [WORK_PERMIT, ENERGY_ISOLATION, GAS_TEST, SUPERVISOR, COMPETENCY]
        status: {type: string, enum: [VERIFIED, REJECTED, EXPIRED]}
        external_reference: {type: string, minLength: 1}
        verified_at: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
    MeasurementCommand:
      type: object
      additionalProperties: false
      required: [client_event_id, measurement_type, value, unit, source, data_quality, verification_status, observed_at]
      properties:
        client_event_id: {type: string, format: uuid}
        device_id: {type: string}
        created_at_device: {type: string, format: date-time}
        component_id: {type: string, format: uuid}
        measurement_type:
          type: string
          enum: [VIBRATION_VELOCITY, TEMPERATURE]
        value:
          type: string
          pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
        unit: {type: string, enum: [MM_PER_S, IN_PER_S, DEG_C, DEG_F]}
        source: {type: string, enum: [MANUAL, INSTRUMENT, EXTERNAL_SYSTEM]}
        data_quality: {type: string, enum: [GOOD, QUESTIONABLE, BAD, UNKNOWN]}
        verification_status: {type: string, enum: [UNVERIFIED, VERIFIED, REJECTED]}
        observed_at: {type: string, format: date-time}
    Measurement:
      type: object
      properties:
        id: {type: string, format: uuid}
        measurement_type: {type: string}
        value: {type: string}
        unit: {type: string}
        original_value: {type: string}
        original_unit: {type: string}
        source: {type: string}
        data_quality: {type: string}
        verification_status: {type: string}
        observed_at: {type: string, format: date-time}
        received_at_server: {type: string, format: date-time}
    AttachmentManifestCommand:
      type: object
      additionalProperties: false
      required: [site_id, entity_kind, entity_id, client_event_id, original_filename, declared_mime, size_bytes, checksum_sha256]
      properties:
        site_id: {type: string, format: uuid}
        entity_kind: {type: string, enum: [EXECUTION, OBSERVATION, INCIDENT, DOCUMENT_REVISION]}
        entity_id: {type: string, format: uuid}
        client_event_id: {type: string, format: uuid}
        original_filename: {type: string}
        declared_mime:
          type: string
          enum: [image/jpeg, image/png, image/webp, audio/m4a, audio/mp4, audio/mpeg, audio/wav, application/pdf, text/plain]
        size_bytes: {type: integer, minimum: 1, maximum: 52428800}
        checksum_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    Attachment:
      type: object
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        entity_kind: {type: string}
        entity_id: {type: string, format: uuid}
        original_filename: {type: string}
        declared_mime: {type: string}
        verified_mime: {type: string}
        size_bytes: {type: integer}
        checksum_sha256: {type: string}
        state:
          type: string
          enum: [PENDING_UPLOAD, UPLOADED, QUARANTINED, AVAILABLE, REJECTED]
        upload_url: {type: string, format: uri}
        upload_headers:
          type: object
          additionalProperties: {type: string}
        upload_expires_at: {type: string, format: date-time}
    DemonstrationEvent:
      type: object
      required:
        [id, ordinal, schema_version, timestamp, actor_id, roles, source,
         trust, sensitivity, action, provenance]
      properties:
        id: {type: string, format: uuid}
        ordinal: {type: integer, minimum: 1}
        schema_version: {type: string}
        timestamp: {type: string, format: date-time}
        actor_id: {type: string, format: uuid}
        roles: {type: array, items: {type: string}}
        source: {type: string}
        trust: {type: string}
        sensitivity: {type: string}
        application: {type: string}
        action: {type: string}
        intent: {type: string}
        entity:
          type: object
          properties:
            type: {type: string}
            id: {type: string}
        input: {type: object, additionalProperties: true}
        output: {type: object, additionalProperties: true}
        context: {type: object, additionalProperties: true}
        decision: {type: object, additionalProperties: true}
        result: {type: object, additionalProperties: true}
        error: {type: string}
        correction_of: {type: string, format: uuid}
        approval_id: {type: string}
        domain_event_id: {type: string, format: uuid}
        provenance: {type: object, additionalProperties: true}
        redactions:
          type: array
          items:
            type: object
            required: [id, event_id, json_path, action, reason]
            properties:
              id: {type: string, format: uuid}
              event_id: {type: string, format: uuid}
              json_path: {type: string}
              action: {type: string, enum: [MASK, DROP]}
              reason: {type: string}
              requested_by: {type: string, format: uuid}
              requested_at: {type: string, format: date-time}
    Demonstration:
      type: object
      required:
        [id, organization_id, site_id, subject_kind, subject_id, workflow_key,
         schema_version, session_id, status, review_status, initial_context,
         events, reviews, capture, started_at, created_by]
      properties:
        id: {type: string, format: uuid}
        organization_id: {type: string, format: uuid}
        site_id: {type: string, format: uuid}
        subject_kind: {type: string, enum: [EXECUTION, HANDOVER]}
        subject_id: {type: string, format: uuid}
        workflow_key: {type: string}
        schema_version: {type: string}
        session_id: {type: string, format: uuid}
        status: {type: string, enum: [recording, completed, rejected]}
        review_status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, REDACTION_REQUIRED]
        initial_context: {type: object, additionalProperties: true}
        final_result: {type: object, additionalProperties: true}
        events:
          type: array
          items: {$ref: "#/components/schemas/DemonstrationEvent"}
        reviews:
          type: array
          items: {type: object, additionalProperties: true}
        capture:
          type: object
          required: [pending, processing, failed, applied]
          properties:
            pending: {type: integer, minimum: 0}
            processing: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            applied: {type: integer, minimum: 0}
            last_error: {type: string}
            updated_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
        created_by: {type: string, format: uuid}
    WorkflowApplicability:
      type: object
      additionalProperties: false
      required: [validation_status]
      properties:
        id: {type: string, format: uuid, readOnly: true}
        site_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        asset_class: {type: string}
        manufacturer: {type: string}
        model: {type: string}
        process_service: {type: string}
        operating_condition: {type: string}
        validation_status:
          type: string
          enum:
            [VALIDATED, LIKELY_APPLICABLE, NOT_VALIDATED, NOT_APPLICABLE]
        approved_by: {type: string, format: uuid, readOnly: true}
        approved_at: {type: string, format: date-time, readOnly: true}
    WorkflowEvidence:
      type: object
      required: [demonstration_id, event_ids]
      properties:
        demonstration_id: {type: string, format: uuid}
        event_ids:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
    WorkflowStep:
      type: object
      required: [id, kind, evidence]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {type: string, enum: [tool, validation, approval]}
        tool_name: {type: string}
        arguments: {type: object, additionalProperties: true}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/WorkflowEvidence"}
    WorkflowVersion:
      type: object
      required:
        [workflow_id, workflow_key, name, version, status, site_id,
         asset_class, candidate_digest, tool_catalog_digest,
         source_demonstration_ids, steps, analysis, behavioral_changes,
         learning, applicability, prerequisites, required_competencies,
         reviews, evaluations, improvement_candidates, created_at]
      properties:
        workflow_id: {type: string, format: uuid}
        workflow_key: {type: string}
        name: {type: string}
        description: {type: string}
        version: {type: integer, minimum: 1}
        status:
          type: string
          enum:
            [CANDIDATE, APPROVED, REVIEW_REQUIRED, PUBLISHED, RETIRED, REJECTED]
        site_id: {type: string, format: uuid}
        asset_class: {type: string}
        candidate_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        tool_catalog_digest: {type: string}
        source_demonstration_ids:
          type: array
          minItems: 2
          items: {type: string, format: uuid}
        steps:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/WorkflowStep"}
        analysis:
          type: object
          additionalProperties: true
          description: Deterministic sequence variants, conflicts, parameters, and findings.
        behavioral_changes:
          type: object
          additionalProperties: true
          description: Behavior-focused diff from the latest stored version.
        learning:
          type: object
          additionalProperties: true
        applicability:
          type: array
          items: {$ref: "#/components/schemas/WorkflowApplicability"}
        prerequisites:
          type: array
          items: {type: string}
        required_competencies:
          type: array
          items: {type: string}
        effective_at: {type: string, format: date-time}
        review_at: {type: string, format: date-time}
        reviews:
          type: array
          items:
            type: object
            additionalProperties: true
        evaluations:
          type: array
          items:
            type: object
            additionalProperties: true
        improvement_candidates:
          type: array
          description: Human corrections awaiting review; never automatic mutations.
          items:
            type: object
            additionalProperties: true
        created_at: {type: string, format: date-time}
        published_at: {type: string, format: date-time}
        published_by: {type: string, format: uuid}
    EvaluationSummary:
      type: object
      additionalProperties: false
      required:
        [recommendations, reviewed, review_coverage,
         recommendation_acceptance, human_override_rate,
         unsafe_recommendation_rate, unsupported_recommendation_rate,
         incorrect_next_step_rate, evidence_coverage, retrieval_precision,
         llm_calls, average_latency_ms, tokens_in, tokens_out,
         estimated_cost_micros,
         workflow_evaluations, workflow_gate_pass_rate, generated_at]
      properties:
        recommendations: {type: integer, format: int64, minimum: 0}
        reviewed: {type: integer, format: int64, minimum: 0}
        review_coverage: {type: number, minimum: 0, maximum: 1}
        recommendation_acceptance: {type: number, minimum: 0, maximum: 1}
        human_override_rate: {type: number, minimum: 0, maximum: 1}
        unsafe_recommendation_rate: {type: number, minimum: 0, maximum: 1}
        unsupported_recommendation_rate: {type: number, minimum: 0, maximum: 1}
        incorrect_next_step_rate: {type: number, minimum: 0, maximum: 1}
        evidence_coverage: {type: number, minimum: 0, maximum: 1}
        retrieval_precision: {type: number, minimum: 0, maximum: 1}
        llm_calls: {type: integer, format: int64, minimum: 0}
        average_latency_ms: {type: number, minimum: 0}
        tokens_in: {type: integer, format: int64, minimum: 0}
        tokens_out: {type: integer, format: int64, minimum: 0}
        estimated_cost_micros: {type: integer, format: int64, minimum: 0}
        workflow_evaluations: {type: integer, format: int64, minimum: 0}
        workflow_gate_pass_rate: {type: number, minimum: 0, maximum: 1}
        generated_at: {type: string, format: date-time}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
