openapi: 3.1.0
info:
  title: Skawld Maintenance API
  version: 0.6.0-phase5
  description: >
    Phase 5 pilot-ready evidence-first maintenance intelligence contract.
    Learned candidates require exact evidence, human review, deterministic
    evaluation, approval authority, and explicit publication. AI quality
    labels are append-oriented. This API exposes no industrial control action
    or permit authority.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
    description: Process and dependency health.
  - name: Authentication
    description: OIDC web session lifecycle.
  - name: Identity
    description: Principal, organization, and site scope.
  - name: Assets
    description: Source-aware asset knowledge and approved criticality.
  - name: Incidents
    description: Lightweight native or external incident context.
  - name: Executions
    description: Deterministic maintenance execution and evidence.
  - name: Attachments
    description: Secure media manifest and verification lifecycle.
  - name: Knowledge
    description: Controlled document revisions, applicability, ingestion, and retrieval.
  - name: Copilot
    description: Typed evidence-backed advisory recommendations; no generic chat.
  - name: Reports
    description: Human-reviewable maintenance report drafts and approval.
  - name: Handovers
    description: Normal-work shift handover drafts and human acceptance.
  - name: Demonstrations
    description: Semantic work capture, provenance, redaction, and expert review.
  - name: Workflows
    description: Evidence-linked candidate compilation, review, applicability, evaluation, publication, and retirement.
  - name: Evaluation
    description: Human-reviewed AI quality and safety metrics.
paths:
  /health/live:
    get:
      summary: Get process liveness
      security: []
      tags: [Health]
      operationId: getLiveness
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /health/ready:
    get:
      summary: Get dependency readiness
      security: []
      tags: [Health]
      operationId: getReadiness
      responses:
        "200":
          description: Required database dependency is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          $ref: "#/components/responses/Problem"
  /auth/login:
    get:
      summary: Begin web OIDC login
      security: []
      tags: [Authentication]
      operationId: beginWebLogin
      parameters:
        - in: query
          name: return_to
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the configured OIDC provider.
  /auth/callback:
    get:
      summary: Complete web OIDC login
      security: []
      tags: [Authentication]
      operationId: finishWebLogin
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        "303":
          description: Session created; redirect to the validated local path.
        "401":
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      summary: Revoke web session
      security: []
      tags: [Authentication]
      operationId: logoutWebSession
      responses:
        "204":
          description: Session revoked and cookie cleared.
  /api/v1/me:
    get:
      summary: Get current principal
      tags: [Identity]
      operationId: getCurrentPrincipal
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Current application principal and effective permissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/organizations:
    post:
      summary: Create an organization
      tags: [Identity]
      operationId: createOrganization
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Organization created atomically with membership and audit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "200":
          description: Original result replayed for an identical idempotent request.
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/sites/{siteID}:
    get:
      summary: Get an authorized site
      tags: [Identity]
      operationId: getAuthorizedSite
      description: >
        Returns a site only when the principal's organization/site membership
        permits it. Unauthorized resources are not disclosed.
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - in: path
          name: siteID
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Authorized site projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/assets:
    get:
      summary: List authorized assets
      tags: [Assets]
      operationId: listAssets
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {in: query, name: site_id, schema: {type: string, format: uuid}}
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: cursor, required: false, schema: {type: string}}
        - {in: query, name: page_size, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: Assets in the principal's authorized scope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, has_more]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Asset"}}
                  next_cursor: {type: [string, "null"]}
                  has_more: {type: boolean}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      summary: Create an asset
      tags: [Assets]
      operationId: createAsset
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateAsset"}
      responses:
        "201":
          description: Asset created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asset"}
        "200": {$ref: "#/components/responses/IdempotentReplay"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/assets/{assetID}:
    get:
      summary: Get asset detail
      tags: [Assets]
      operationId: getAsset
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/AssetID"}]
      responses:
        "200":
          description: Authorized asset detail.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Asset"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/assets/{assetID}/criticality-approvals:
    post:
      summary: Approve asset criticality
      tags: [Assets]
      operationId: approveAssetCriticality
      description: Requires both RBAC permission and a matching ApprovalAuthority.
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/AssetID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CriticalityCommand"}
      responses:
        "201": {description: Human-approved criticality recorded.}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/incidents:
    get:
      summary: List authorized incidents
      tags: [Incidents]
      operationId: listIncidents
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {in: query, name: site_id, schema: {type: string, format: uuid}}
        - {in: query, name: asset_id, schema: {type: string, format: uuid}}
        - {in: query, name: state, schema: {type: string, enum: [OPEN, IN_PROGRESS, RESOLVED]}}
        - {in: query, name: cursor, required: false, schema: {type: string}}
        - {in: query, name: page_size, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: Incidents in the authorized scope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, has_more]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Incident"}}
                  next_cursor: {type: [string, "null"]}
                  has_more: {type: boolean}
    post:
      summary: Create an incident
      tags: [Incidents]
      operationId: createIncident
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateIncident"}
      responses:
        "201":
          description: Incident created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incident"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/incidents/{incidentID}:
    get:
      summary: Get incident detail
      tags: [Incidents]
      operationId: getIncident
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/IncidentID"}]
      responses:
        "200":
          description: Authorized incident detail.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Incident"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/incidents/{incidentID}/resolution:
    post:
      summary: Resolve an incident
      tags: [Incidents]
      operationId: resolveIncident
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/IncidentID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, resolution_summary]
              properties:
                expected_version: {type: integer, format: int64, minimum: 1}
                resolution_summary: {type: string, minLength: 1}
      responses:
        "200": {description: Incident resolved by an authorized actor.}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/incidents/{incidentID}/executions:
    post:
      summary: Create a pump inspection execution
      tags: [Executions]
      operationId: createPumpInspectionExecution
      description: Creates the Phase 1 deterministic pump inspection; not a CMMS work order.
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/IncidentID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                assigned_to: {type: string, format: uuid}
                purpose: {type: string, minLength: 1}
      responses:
        "201":
          description: Execution created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Execution"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/executions:
    get:
      summary: List assigned or authorized executions
      tags: [Executions]
      operationId: listExecutions
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {in: query, name: site_id, schema: {type: string, format: uuid}}
        - {in: query, name: state, schema: {type: string, enum: [ASSIGNED, IN_PROGRESS, COMPLETED]}}
        - {in: query, name: assigned_to, schema: {type: string, description: "Use me for the current mobile principal."}}
        - {in: query, name: cursor, required: false, schema: {type: string}}
        - {in: query, name: page_size, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: Executions visible to the principal; field roles are constrained to their own assignments.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, has_more]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Execution"}}
                  next_cursor: {type: [string, "null"]}
                  has_more: {type: boolean}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/executions/{executionID}:
    get:
      summary: Get execution detail
      tags: [Executions]
      operationId: getExecution
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/ExecutionID"}]
      responses:
        "200":
          description: Execution with steps and field evidence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Execution"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/executions/{executionID}/start:
    post:
      summary: Start an execution
      tags: [Executions]
      operationId: startExecution
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ExecutionID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody: {$ref: "#/components/requestBodies/ExpectedVersion"}
      responses:
        "200": {description: Execution started.}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/executions/{executionID}/steps/{stepID}/complete:
    post:
      summary: Complete an execution step
      tags: [Executions]
      operationId: completeExecutionStep
      description: Returns 409 and a blocked step when a required external prerequisite is absent.
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ExecutionID"}
        - {in: path, name: stepID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_execution_version, expected_step_version]
              properties:
                expected_execution_version: {type: integer, format: int64, minimum: 1}
                expected_step_version: {type: integer, format: int64, minimum: 1}
      responses:
        "200": {description: Step completed.}
        "409":
          description: Version conflict or safety prerequisite blocked the step.
  /api/v1/executions/{executionID}/prerequisite-verifications:
    post:
      summary: Record external prerequisite evidence
      tags: [Executions]
      operationId: recordExternalPrerequisiteVerification
      description: Records evidence from an external PTW/LOTO authority; Skawld is not that authority.
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ExecutionID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PrerequisiteVerificationCommand"}
      responses:
        "201": {description: External verification evidence recorded.}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/executions/{executionID}/measurements:
    post:
      summary: Record a maintenance measurement
      tags: [Executions]
      operationId: recordMeasurement
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ExecutionID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MeasurementCommand"}
      responses:
        "201":
          description: Exact, deterministically converted maintenance measurement recorded.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Measurement"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/executions/{executionID}/observations:
    post:
      summary: Record an observation
      tags: [Executions]
      operationId: recordObservation
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ExecutionID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201": {description: "Human, voice, vision-candidate, or external observation recorded."}
  /api/v1/executions/{executionID}/actions:
    post:
      summary: Record a maintenance action
      tags: [Executions]
      operationId: recordMaintenanceAction
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ExecutionID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201": {description: Non-control maintenance action evidence recorded.}
  /api/v1/executions/{executionID}/decisions:
    post:
      summary: Record a technician decision
      tags: [Executions]
      operationId: recordExecutionDecision
      description: Captures a semantic decision, rationale, alternatives, and context rather than UI coordinates.
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ExecutionID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_event_id, decision, rationale, decided_at]
              properties:
                client_event_id: {type: string, format: uuid}
                device_id: {type: string}
                created_at_device: {type: string, format: date-time}
                step_id: {type: string, format: uuid}
                component_id: {type: string, format: uuid}
                decision: {type: string, minLength: 1}
                rationale: {type: string, minLength: 1}
                alternatives: {type: array, items: {type: string}}
                decided_at: {type: string, format: date-time}
      responses:
        "201": {description: Semantic technician decision recorded.}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/executions/{executionID}/complete:
    post:
      summary: Complete an execution
      tags: [Executions]
      operationId: completeExecution
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/ExecutionID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200": {description: Fully completed execution closed with an outcome summary.}
  /api/v1/attachments:
    post:
      summary: Create an attachment manifest
      tags: [Attachments]
      operationId: createAttachmentManifest
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AttachmentManifestCommand"}
      responses:
        "201":
          description: Pending manifest and constrained signed upload request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Attachment"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/attachments/{attachmentID}/complete:
    post:
      summary: Verify a completed attachment upload
      tags: [Attachments]
      operationId: completeAttachmentUpload
      description: Streams and verifies object size, SHA-256, and magic-byte MIME before availability.
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {in: path, name: attachmentID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: Attachment verified and available.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Attachment"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/attachments/{attachmentID}/transcriptions:
    post:
      summary: Queue transcription through the configured provider
      description: >
        The transcript is always an unverified candidate until a human verifies
        or rejects it. Returns 503 when no deployment speech provider is configured.
      tags: [Attachments]
      operationId: requestAttachmentTranscription
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {in: path, name: attachmentID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "202": {description: Transcription job queued transactionally.}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/transcriptions/{transcriptionID}:
    get:
      summary: Get transcription candidate and verification state
      tags: [Attachments]
      operationId: getTranscription
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {in: path, name: transcriptionID, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Versioned candidate with provider and source provenance.}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/transcriptions/{transcriptionID}/verify:
    post:
      summary: Human-verify, correct, or reject a transcript candidate
      tags: [Attachments]
      operationId: verifyTranscription
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {in: path, name: transcriptionID, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, transcript, accept]
              properties:
                expected_version: {type: integer, format: int64, minimum: 1}
                transcript: {type: string, maxLength: 50000}
                accept: {type: boolean}
      responses:
        "200": {description: Candidate verified/corrected or rejected by a human.}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/documents:
    get:
      summary: List authorized controlled documents
      tags: [Knowledge]
      operationId: listDocuments
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {in: query, name: site_id, schema: {type: string, format: uuid}}
        - {in: query, name: cursor, required: false, schema: {type: string}}
        - {in: query, name: page_size, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        "200":
          description: Documents and revision lifecycle in authorized scope.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, has_more]
                properties:
                  items: {type: array, items: {type: object}}
                  next_cursor: {type: [string, "null"]}
                  has_more: {type: boolean}
    post:
      summary: Create controlled document metadata
      tags: [Knowledge]
      operationId: createDocument
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [site_id, document_type, title, authority]
              properties:
                site_id: {type: string, format: uuid}
                document_type:
                  type: string
                  enum: [OEM_MANUAL, SOP, WORK_INSTRUCTION, DATASHEET, INSPECTION_PROCEDURE, SAFETY_PROCEDURE, TECHNICAL_BULLETIN]
                title: {type: string, minLength: 1}
                authority:
                  type: string
                  enum: [OEM, CORPORATE, SITE_APPROVED, REGULATORY, EXPERT_REFERENCE]
                source_reference: {type: string}
      responses:
        "201": {description: Document metadata created.}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/documents/{documentID}:
    get:
      summary: Get document and revision validity
      tags: [Knowledge]
      operationId: getDocument
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {in: path, name: documentID, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Controlled document with revision history.}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/documents/{documentID}/revisions:
    post:
      summary: Create a document revision and applicability
      tags: [Knowledge]
      operationId: createDocumentRevision
      security: [{sessionCookie: []}, {bearerAuth: []}]
      parameters:
        - {in: path, name: documentID, required: true, schema: {type: string, format: uuid}}
